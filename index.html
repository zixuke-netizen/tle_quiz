<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #2563eb;

            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --correct: #16a34a;
            --incorrect: #dc2626;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            background-color: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--primary);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            background-color: var(--card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-btn.correct {
            border-color: var(--correct);
            background-color: #f0fdf4;
            color: var(--correct);
            font-weight: 600;
        }

        .option-btn.incorrect {
            border-color: var(--incorrect);
            background-color: #fef2f2;
            color: var(--incorrect);
            font-weight: 600;
        }

        .feedback {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .feedback.correct {
            display: block;
            background-color: #f0fdf4;
            color: var(--correct);
            border: 1px solid #bbf7d0;
        }

        .feedback.incorrect {
            display: block;
            background-color: #fef2f2;
            color: var(--incorrect);
            border: 1px solid #fecaca;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        .results {
            text-align: center;
            padding: 20px 0;
        }

        .results h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 16px 0;
        }

        .restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

</div>

let currentQ = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const qData = quizData[currentQ];
    
    document.getElementById("question-count").innerText = `Question ${currentQ + 1} of ${quizData.length}`;
    document.getElementById("score-count").innerText = `Score: ${score}`;
    document.getElementById("progress").style.width = `${((currentQ) / quizData.length) * 100}%`;
    
    document.getElementById("question").innerText = `${currentQ + 1}. ${qData.q}`;
    
    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";
    
    qData.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
    });
    
    const feedback = document.getElementById("feedback");
    feedback.style.display = "none";
    feedback.className = "feedback";
    
    document.getElementById("next-btn").style.display = "none";
}

function selectOption(selectedIdx) {
    if (answered) return;
    answered = true;
    
    const qData = quizData[currentQ];
    const buttons = document.querySelectorAll(".option-btn");
    const feedback = document.getElementById("feedback");
    
    buttons.forEach(btn => btn.disabled = true);
    
    if (selectedIdx === qData.answer) {
        score++;
        buttons[selectedIdx].classList.add("correct");
        feedback.className = "feedback correct";
        feedback.innerText = `Correct! ${qData.exp}`;
    } else {
        buttons[selectedIdx].classList.add("incorrect");
        buttons[qData.answer].classList.add("correct");
        feedback.className = "feedback incorrect";
        feedback.innerText = `Incorrect. ${qData.exp}`;
    }
    
    document.getElementById("score-count").innerText = `Score: ${score}`;
    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentQ++;
    if (currentQ < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-body").style.display = "none";
    document.getElementById("results-body").style.display = "block";
    document.getElementById("progress").style.width = "100%";
    document.getElementById("final-score").innerText = `${score} / ${quizData.length}`;
    
    const pct = (score / quizData.length) * 100;
    let msg = "";
    if (pct === 100) msg = "Perfect score! You mastered the entire reviewer!";
    else if (pct >= 85) msg = "Excellent job! You're completely ready for the exam.";
    else if (pct >= 70) msg = "Great effort! A quick review will make your score perfect.";
    else msg = "Good start! Go over the reviewer notes once more and try again.";
    
    document.getElementById("feedback-message").innerText = msg;
}

function restartQuiz() {
    currentQ = 0;
    score = 0;
    document.getElementById("quiz-body").style.display = "block";
    document.getElementById("results-body").style.display = "none";
    loadQuestion();
}

loadQuestion();
